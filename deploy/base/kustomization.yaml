apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apptracker
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Image tag is managed here. release-please rewrites newTag on each release via
# the annotation below; Flux image-automation could own this field instead.
images:
  - name: ghcr.io/iammrcupp/apptracker
    newTag: 0.5.0 # x-release-please-version

# Password Secret is NOT stored in plaintext git — see deploy/flux/secret.sops.yaml
# (encrypt with SOPS or use a SealedSecret). Referenced by name: apptracker-auth.
