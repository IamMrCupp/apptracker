apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apptracker
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Image tag is managed here (or by Flux image-automation writing this field).
images:
  - name: ghcr.io/iammrcupp/apptracker
    newTag: 0.1.0

# Password Secret is NOT stored in plaintext git — see deploy/flux/secret.sops.yaml
# (encrypt with SOPS or use a SealedSecret). Referenced by name: apptracker-auth.
