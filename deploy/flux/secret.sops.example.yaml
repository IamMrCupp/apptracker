# Example only — encrypt before committing:  sops --encrypt --in-place secret.sops.yaml
# Or replace with a SealedSecret if you use the sealed-secrets controller.
#
# Generate both values before encrypting:
#   password:   your own choice
#   sessionKey: openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: apptracker-auth
  namespace: apptracker
type: Opaque
stringData:
  password: change-me-to-a-long-random-string
  # Signs session cookies. If unset the app generates a random key at startup,
  # which means every pod restart logs you out. Changing it invalidates all
  # existing sessions — which is also how you force a logout everywhere.
  sessionKey: change-me-to-a-long-random-string
