version: 2
updates:
  # Five workflows pin actions by major tag. Nothing otherwise signals when a
  # pinned major goes stale or picks up a security fix.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies]

  # modernc.org/sqlite is the only direct dependency; everything else in go.mod
  # is indirect. Grouped so a transitive bump does not arrive as eight PRs.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels: [dependencies]
    groups:
      go-dependencies:
        patterns: ["*"]
