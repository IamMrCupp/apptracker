name: Publish

on:
  # Publishing on every main merge means the workflow is exercised continuously
  # rather than only discovered to be broken at release time.
  push:
    branches: [main]

  # Called by release-please.yml when a release is cut.
  #
  # Deliberately NOT `release: [published]`. Releases created with the built-in
  # GITHUB_TOKEN do not emit workflow-triggering events — GitHub suppresses them
  # to prevent recursive runs — so a `release:` trigger would sit there looking
  # correct and never once fire. workflow_call is explicit and testable.
  workflow_call:
    inputs:
      version:
        description: "Semver to tag, without the leading v. Empty on branch pushes."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  # Never cancel a publish midway — a half-pushed manifest is worse than a queue.
  cancel-in-progress: false

env:
  # Hardcoded lowercase rather than ${{ github.repository }}, which is
  # mixed-case ("IamMrCupp/apptracker") while GHCR requires lowercase. This
  # literal must match the image name in deploy/base/kustomization.yaml.
  IMAGE: ghcr.io/iammrcupp/apptracker

jobs:
  publish:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # No QEMU: the Dockerfile pins its build stage to $BUILDPLATFORM and
      # cross-compiles via GOARCH, so arm64 costs roughly nothing.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keeps the manifest list to exactly the two real platforms. With
          # provenance on, buildx adds "unknown/unknown" entries that make
          # `docker manifest inspect` output confusing. Worth revisiting if
          # supply-chain attestation becomes a goal.
          provenance: false
