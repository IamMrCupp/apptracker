name: Release

on:
  push:
    branches: [main]
  # Lets a release PR be regenerated without an empty commit to main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: release PR / tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Releases cut with GITHUB_TOKEN do not fire `release: published`, so the
  # image publish is invoked directly rather than by event.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    permissions:
      contents: read
      packages: write
