name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Findings can land without anyone pushing — new queries ship on their own
  # schedule, so scan weekly regardless of activity.
  schedule:
    - cron: "27 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          # The repo now carries five workflow files, and workflows are code —
          # this catches script injection and similar in them.
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@v4

      # Pin the toolchain to go.mod so autobuild doesn't analyse against
      # whatever Go the runner image happens to ship.
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: true

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
